name: Generate Theme Index

on:
  push:
    branches: [main]
    paths:
      - "themes/**.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all themes
        run: |
          python3 - <<'EOF'
          import json
          import glob
          import os
          import re
          import sys

          # All individual color keys are optional; only name/author/type/colors are required.
          # Old underscore terminal keys are accepted but emit a warning.
          LEGACY_TERMINAL_KEYS = {
              "terminal_background", "terminal_foreground",
              "terminal_black", "terminal_red", "terminal_green", "terminal_yellow",
              "terminal_blue", "terminal_magenta", "terminal_cyan", "terminal_white",
              "terminal_bright_black", "terminal_bright_red", "terminal_bright_green",
              "terminal_bright_yellow", "terminal_bright_blue", "terminal_bright_magenta",
              "terminal_bright_cyan", "terminal_bright_white",
          }

          # Accepts: #RGB, #RRGGBB, #RRGGBBAA
          HEX_RE = re.compile(r"^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$")
          VALID_TYPES = {"dark", "light"}

          errors = []
          warnings = []

          paths = sorted(glob.glob("themes/*.json"))
          if not paths:
              print("No theme files found in themes/.")
              sys.exit(0)

          seen_ids = {}

          for path in paths:
              stem = os.path.splitext(os.path.basename(path))[0]
              file_errors = []
              file_warnings = []

              if stem != stem.lower() or not re.match(r"^[a-z0-9]+(-[a-z0-9]+)*$", stem):
                  file_errors.append(f"Filename '{stem}' must be lowercase kebab-case (e.g. my-cool-theme)")

              if stem in seen_ids:
                  file_errors.append(f"Duplicate theme id '{stem}' — already used by {seen_ids[stem]}")
              seen_ids[stem] = path

              try:
                  with open(path) as f:
                      data = json.load(f)
              except json.JSONDecodeError as e:
                  errors.append(f"{path}: Invalid JSON — {e}")
                  continue

              for field in ("name", "author", "type"):
                  if field not in data:
                      file_errors.append(f"Missing required field '{field}'")

              if "type" in data and data["type"] not in VALID_TYPES:
                  file_errors.append(f"'type' must be 'dark' or 'light', got '{data['type']}'")

              colors = data.get("colors")
              if not isinstance(colors, dict):
                  file_errors.append("'colors' must be an object")
              else:
                  legacy = [k for k in colors if k in LEGACY_TERMINAL_KEYS]
                  if legacy:
                      file_warnings.append(
                          f"Legacy v1 terminal keys found (migrate to dot-notation): {', '.join(sorted(legacy))}"
                      )

                  invalid_hex = [
                      f"{k}={v!r}"
                      for k, v in colors.items()
                      if not (isinstance(v, str) and HEX_RE.match(v))
                  ]
                  if invalid_hex:
                      file_errors.append(f"Invalid color values (expected #RGB / #RRGGBB / #RRGGBBAA): {', '.join(invalid_hex)}")

              if file_errors:
                  errors.append(f"\n{path}:")
                  for e in file_errors:
                      errors.append(f"  ERROR: {e}")

              if file_warnings:
                  warnings.append(f"\n{path}:")
                  for w in file_warnings:
                      warnings.append(f"  WARNING: {w}")

          if warnings:
              print("Theme validation warnings:\n")
              print("\n".join(warnings))
              print()

          if errors:
              print("Theme validation FAILED:\n")
              print("\n".join(errors))
              sys.exit(1)

          print(f"All {len(paths)} theme(s) passed validation.")
          EOF

  generate:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate index.json
        run: |
          python3 - <<'EOF'
          import json
          import glob
          import os

          themes = []
          for path in sorted(glob.glob("themes/*.json")):
              with open(path) as f:
                  data = json.load(f)
              stem = os.path.splitext(os.path.basename(path))[0]
              colors = data.get("colors", {})

              # Prefer v2 dot-notation keys; fall back to legacy underscore keys for thumbnail fields
              background      = colors.get("background", "")
              primary         = colors.get("primary", "")
              sidebar_bg      = (
                  colors.get("sidebar.background") or
                  colors.get("sidebar", "")
              )
              toolbar_bg      = colors.get("toolbar.background", sidebar_bg)

              themes.append({
                  "id": stem,
                  "name": data.get("name", stem),
                  "version": data.get("version", "1.0.0"),
                  "description": data.get("description", ""),
                  "author": data.get("author", ""),
                  "authorUrl": data.get("authorUrl", ""),
                  "type": data.get("type", "dark"),
                  "rawUrl": f"https://raw.githubusercontent.com/Snenjih/nexum-themes/main/themes/{stem}.json",
                  "preview": {
                      "background": background,
                      "primary": primary,
                      "sidebar": sidebar_bg,
                      "toolbar": toolbar_bg,
                  },
              })

          themes.sort(key=lambda t: t["name"].lower())

          with open("index.json", "w") as f:
              json.dump(themes, f, indent=2)
              f.write("\n")

          print(f"Generated index.json with {len(themes)} theme(s).")
          EOF

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: regenerate index.json"
          git push

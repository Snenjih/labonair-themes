name: Validate Themes

on:
  pull_request:
    paths:
      - "themes/**.json"
  push:
    branches: [main]
    paths:
      - "themes/**.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all themes
        run: |
          python3 - <<'EOF'
          import json
          import glob
          import os
          import re
          import sys

          # All individual color keys are optional; only name/variants are required.
          # Old underscore terminal keys are accepted but emit a warning.
          LEGACY_TERMINAL_KEYS = {
              "terminal_background", "terminal_foreground",
              "terminal_black", "terminal_red", "terminal_green", "terminal_yellow",
              "terminal_blue", "terminal_magenta", "terminal_cyan", "terminal_white",
              "terminal_bright_black", "terminal_bright_red", "terminal_bright_green",
              "terminal_bright_yellow", "terminal_bright_blue", "terminal_bright_magenta",
              "terminal_bright_cyan", "terminal_bright_white",
          }

          # Accepts: #RGB, #RRGGBB, #RRGGBBAA
          HEX_RE = re.compile(r"^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$")
          VALID_MODES = {"dark", "light"}

          errors = []
          warnings = []

          paths = sorted(glob.glob("themes/*.json"))
          if not paths:
              print("No theme files found in themes/.")
              sys.exit(0)

          seen_ids = {}

          for path in paths:
              stem = os.path.splitext(os.path.basename(path))[0]
              file_errors = []
              file_warnings = []

              # filename must be lowercase kebab-case
              if stem != stem.lower() or not re.match(r"^[a-z0-9]+(-[a-z0-9]+)*$", stem):
                  file_errors.append(f"Filename '{stem}' must be lowercase kebab-case (e.g. my-cool-theme)")

              # duplicate id check
              if stem in seen_ids:
                  file_errors.append(f"Duplicate theme id '{stem}' — already used by {seen_ids[stem]}")
              seen_ids[stem] = path

              # parse JSON
              try:
                  with open(path) as f:
                      data = json.load(f)
              except json.JSONDecodeError as e:
                  errors.append(f"{path}: Invalid JSON — {e}")
                  continue

              # required top-level fields
              for field in ("name", "variants"):
                  if field not in data:
                      file_errors.append(f"Missing required field '{field}'")

              # variants object
              variants = data.get("variants")
              if not isinstance(variants, dict) or not variants:
                  file_errors.append("'variants' must be a non-empty object")
              else:
                  modes_seen = set()
                  for key, variant in variants.items():
                      if not isinstance(variant, dict):
                          file_errors.append(f"variants.{key} must be an object")
                          continue

                      mode = variant.get("mode")
                      if mode not in VALID_MODES:
                          file_errors.append(
                              f"variants.{key}.mode must be 'dark' or 'light', got {mode!r}"
                          )
                      else:
                          modes_seen.add(mode)

                      colors = variant.get("colors")
                      if not isinstance(colors, dict):
                          file_errors.append(f"variants.{key}.colors must be an object")
                          continue

                      # warn about legacy underscore terminal keys
                      legacy = [k for k in colors if k in LEGACY_TERMINAL_KEYS]
                      if legacy:
                          file_warnings.append(
                              f"variants.{key}: legacy v1 terminal keys found (migrate to dot-notation): "
                              f"{', '.join(sorted(legacy))}"
                          )

                      # validate all color values are hex strings
                      invalid_hex = [
                          f"{k}={v!r}"
                          for k, v in colors.items()
                          if not (isinstance(v, str) and HEX_RE.match(v))
                      ]
                      if invalid_hex:
                          file_errors.append(
                              f"variants.{key}: invalid color values (expected #RGB / #RRGGBB / #RRGGBBAA): "
                              f"{', '.join(invalid_hex)}"
                          )

                  if "dark" not in modes_seen or "light" not in modes_seen:
                      file_errors.append(
                          "'variants' must include at least one entry with mode \"dark\" and one with mode \"light\" "
                          f"(found: {sorted(modes_seen) or 'none'})"
                      )

              if file_errors:
                  errors.append(f"\n{path}:")
                  for e in file_errors:
                      errors.append(f"  ERROR: {e}")

              if file_warnings:
                  warnings.append(f"\n{path}:")
                  for w in file_warnings:
                      warnings.append(f"  WARNING: {w}")

          if warnings:
              print("Theme validation warnings:\n")
              print("\n".join(warnings))
              print()

          if errors:
              print("Theme validation FAILED:\n")
              print("\n".join(errors))
              sys.exit(1)

          print(f"All {len(paths)} theme(s) passed validation.")
          EOF
